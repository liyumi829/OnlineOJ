<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人OJ系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
        }

        .container .navbar {
            width: 100%;
            height: 50px;
            background-color: #1f2937;
            overflow: hidden;
        }

        .container .navbar a {
            display: inline-block;
            width: 100px;
            color: white;
            font-size: 16px;
            line-height: 50px;
            text-decoration: none;
            text-align: center;
            transition: 0.3s;
        }

        .container .navbar a:hover {
            background-color: #10b981;
        }

        .container .navbar .login {
            float: right;
        }

        .container .content {
            width: 800px;
            margin: 0 auto;
            text-align: center;
            margin-top: 180px;
        }

        .container .content h1 {
            font-size: 32px;
            font-weight: normal;
            color: #222;
        }

        .container .content p {
            font-size: 18px;
            margin-top: 20px;
            color: #444;
        }

        .container .content a {
            display: inline-block;
            margin-top: 30px;
            font-size: 18px;
            color: #10b981;
            text-decoration: none;
            border: 2px solid #10b981;
            padding: 10px 25px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .container .content a:hover {
            background-color: #10b981;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 导航栏 -->
        <div class="navbar">
            <a href="#">首页</a>
            <a href="/problem/list?page=1">题库</a>
            <a href="#">竞赛</a>
            <a href="#">讨论</a>
            <a href="#">求职</a>
            <a class="login" href="#">登录</a>
        </div>

        <!-- 网页内容 -->
        <div class="content">
            <h1>欢迎来到我的 OnlineJudge 平台</h1>
            <p>这是我个人独立开发的在线OJ平台</p>
            <a href="/problem/list?page=1">点击开始编程</a>
        </div>
    </div>
</body>

</html>
