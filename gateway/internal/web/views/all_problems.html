<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlineJudge题目列表</title>
    <style>
        * { margin: 0px; padding: 0px; }
        html, body { width: 100%; height: 100%; }
        .container .navbar { width: 100%; height: 50px; background-color: black; overflow: hidden; }
        .container .navbar a { display: inline-block; width: 80px; color: white; font-size: large; line-height: 50px; text-decoration: none; text-align: center; }
        .container .navbar a:hover { background-color: green; }
        .container .navbar .login { float: right; }
        .container .question_list { padding-top: 50px; width: 800px; height: 100%; margin: 0px auto; text-align: center; }
        .container .question_list table { width: 100%; font-size: large; font-family: 'Lucida Sans', sans-serif; margin-top: 50px; background-color: rgb(243, 248, 246); }
        .container .question_list h1 { color: green; }
        .container .question_list table .item { width: 100px; height: 40px; font-size: large; font-family: 'Times New Roman', Times, serif; }
        .container .question_list table .item a { text-decoration: none; color: black; }
        .container .question_list table .item a:hover { color: blue; text-decoration: underline; }
        .container .footer { width: 100%; height: 50px; text-align: center; line-height: 50px; color: #ccc; margin-top: 15px; }
        
        /* 分页样式 */
        .pagination {
            margin-top: 20px;
            padding-bottom: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .pagination .btn {
            padding: 5px 15px;
            border: 1px solid green;
            color: green;
            text-decoration: none;
            border-radius: 4px;
        }
        .pagination .btn:hover {
            background-color: green;
            color: white;
        }
        .pagination .current {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <a href="/">首页</a>
            <a href="/problems">题库</a>
            <a href="#">竞赛</a>
            <a href="#">讨论</a>
            <a href="#">求职</a>
            <a class="login" href="#">登录</a>
        </div>

        <div class="question_list">
            <h1>OnlineJuge题目列表</h1>
            <table>
                <tr>
                    <th class="item">编号</th>
                    <th class="item">标题</th>
                    <th class="item">难度</th>
                </tr>
                {{range .QuestionList}}
                <tr>
                    <td class="item">{{.ID}}</td>
                    <td class="item"><a href="/problem/{{.ID}}">{{.TitleNumber}}</a></td>
                    <td class="item">{{.Star}}</td>
                </tr>
                {{end}}
            </table>

            <div class="pagination">
                <span>共 {{.Total}} 个题目，共 {{.TotalPage}} 页</span>

                <!-- 一键跳回首页 → 新增！-->
                <a href="/problems?page=1" class="btn">首页</a>

                {{if gt .CurrentPage 1}}
                <a href="/problems?page={{.PrevPage}}" class="btn">上一页</a>
                {{end}}

                <span class="current">第 {{.CurrentPage}} 页</span>

                {{if lt .CurrentPage .TotalPage}}
                <a href="/problems?page={{.NextPage}}" class="btn">下一页</a>
                {{end}}
            </div>
        </div>

        <div class="footer">
            <h4>@liyumi829</h4>
        </div>
    </div>
</body>
</html>
