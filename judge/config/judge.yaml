# 文件：OnlineOj/judge/config/judge.yaml

# Judge 配置文件
# 说明：
# 1. 日志目录、临时目录从这里读取
# 2. host / port / mode / name / id 由 Makefile 传参覆盖

app:
  log_path: ./logs # 日志目录
  temp_path: ./temp # 判题临时目录
  global_timeout: 1 # 全局判题超时时间

rpc:
  instance_name: ""
  addr: 127.0.0.1:10000 # 监听的地址

redis:
  addrs:
    - 127.0.0.1:6379  # Redis 地址，集群写多个
  password: ""         # 密码，没有就空
  db: 0                # 数据库，集群只能用0

  # 连接池（生产环境必须）
  poolSize: 100        # 最大连接数
  minIdleConns: 10    # 最小空闲连接