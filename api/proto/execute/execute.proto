syntax = "proto3";
package compileandrun;

option go_package = ".;execute";

service CompileAndRun {
  rpc ExecuteCode (ExecuteRequest) returns (ExecuteResponse) {}
}

message ExecuteRequest {
  int32 codeType = 1; // 用户代码类型
  string code = 2; // 用户代码
  int64 cpuLimit = 3; // CPU限制
  int64 memoLimit = 4; // 内存限制
}

message ExecuteResponse {
  string status = 1; // 状态
  string stdout = 2; // 标准输出
  string stderr = 3; // 标准错误
  int64 time = 4; // 实际运行时间
  int64 memory = 5; // 实际使用内存
}

