syntax = "proto3";
package judge;

option go_package = ".;judge";

service JudgeService  {
  rpc Judge (JudgeRequest) returns (JudgeResponse);
  rpc Ping(PingRequest) returns (PingResponse);
}

message CaseResult {
  bool passed = 1;   // 是否通过
  int64 time = 2;    // 本组耗时
  int64 memory = 3;  // 本组内存
  string status = 4; // 当前测试用例状态
  string output = 5; // 用户程序输出
}

message TestCase {
  string input = 1;
  string output = 2;
}

message JudgeRequest {
  string submission_id = 1; // 提交ID
  string code = 2; // 用户代码
  int32 codeType = 3; // 用户代码类型
  int64 cpuLimit = 4; // CPU限制
  int64 memoLimit = 5; // 内存限制
  repeated TestCase testCases = 6; // 测试用例
}

message JudgeResponse {
  string submission_id = 1; // 提交ID
  string status = 2; // 状态 AC/WA/TLE/MLE
  string stdout = 3; // 标准输出
  string stderr = 4; // 标准错误
  int64 time = 5; // 实际运行时间(ns)
  int64 memory = 6; // 实际使用内存(kb)
  repeated CaseResult results = 7; // 测试结果
}

message PingRequest {}

message PingResponse {
  bool ok = 1; // 服务是否可用
  string node_id = 2; // 服务实例标识，可用于排查问题
  int64 timestamp_ms = 3; // 当前服务时间戳（毫秒）
  string message = 4; // 附加信息
}

